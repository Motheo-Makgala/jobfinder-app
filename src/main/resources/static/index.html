<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Finder</title>
    <br></br>
    <p>Upload your cv and find the jobs related.</p>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        textarea, input, select { width: 100%; padding: .6rem; margin: .3rem 0 .8rem; box-sizing: border-box; font: inherit; }
        textarea { height: 140px; }
        button { padding: .7rem 1.4rem; font: inherit; cursor: pointer; }
        .job { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
        .pct { float: right; font-weight: bold; font-size: 1.2rem; }
        .ok { color: #1a7f37; } .miss { color: #b42318; }
        .meta { color: #666; font-size: .9rem; }
    </style>
</head>
<body>
<h1>Job Finder</h1>
<label>Your CV (paste the text for now)</label>
<textarea id="cv" placeholder="Paste your CV text here"></textarea>
<label>Desired job title</label>
<input id="title" placeholder="e.g. Test Automation Engineer (leave blank for all)">
<label>Location</label>
<input id="location" placeholder="e.g. Johannesburg (leave blank for all)">
<label>Posted within</label>
<select id="days">
    <option value="3">Last 3 days</option>
    <option value="7">Last 7 days</option>
    <option value="14">Last 14 days</option>
    <option value="30" selected>Last 30 days</option>
</select>
<button onclick="search()">Find jobs</button>
<div id="results"></div>

<script>
    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
    }

    async function search() {
        const body = {
            cvText: document.getElementById('cv').value,
            title: document.getElementById('title').value,
            location: document.getElementById('location').value,
            daysPosted: parseInt(document.getElementById('days').value, 10)
        };
        const out = document.getElementById('results');
        out.textContent = 'Searching...';
        try {
            const res = await fetch('/api/match', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error('Server returned ' + res.status);
            const data = await res.json();
            if (data.length === 0) { out.textContent = 'No jobs found.'; return; }
            out.innerHTML = data.map(r => `
      <div class="job">
        <span class="pct">${r.matchPercent}%</span>
        <strong>${esc(r.job.title)}</strong> at ${esc(r.job.company)}
        <div class="meta">${esc(r.job.location)} · posted ${esc(r.job.datePosted)}</div>
        <p>${esc(r.job.description)}</p>
        <div class="ok">Matched: ${esc(r.matchedSkills.join(', ') || 'none')}</div>
        <div class="miss">Missing: ${esc(r.missingSkills.join(', ') || 'none')}</div>
      </div>`).join('');
        } catch (e) {
            out.textContent = 'Something went wrong: ' + e.message;
        }
    }
</script>
</body>
</html>
